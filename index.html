<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tindahan POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="store-sign">
    <div class="sign-board">
      <p class="sign-eyebrow">est. this session</p>
      <h1 class="sign-title">Tindahan ni Aling Neneng</h1>
      <p class="sign-tagline">sari-sari store &middot; point of sale</p>
    </div>
    <p id="sync-status" class="sync-status">Syncing supplier catalog&hellip;</p>
  </header>

  <div id="notice" class="notice-slot"></div>

  <main class="layout">

    <section class="panel catalog-panel" aria-label="Product catalog">
      <div class="panel-header">
        <h2>Today's Stock</h2>
        <input id="search-input" type="text" placeholder="Search products&hellip;" class="search-input" />
      </div>
      <div id="catalog" class="catalog-grid"></div>
    </section>

    <section class="panel cart-panel" aria-label="Current transaction">
      <h2>Current Sale</h2>
      <div id="cart" class="cart-slot"></div>
      <div class="cart-summary">
        <p class="total-row">Total due: <strong id="cart-total">₱0.00</strong></p>
        <label class="paid-label" for="amount-paid">Amount paid</label>
        <input id="amount-paid" type="number" min="0" step="0.01" placeholder="0.00" class="paid-input" />
        <button id="checkout-btn" class="btn btn-primary btn-checkout">Complete sale</button>
      </div>
    </section>

    <section class="panel report-panel" aria-label="Session report">
      <h2>Session Report</h2>
      <div id="report" class="report-summary"></div>
      <h3 class="transactions-heading">Transaction Log</h3>
      <div id="transactions" class="transactions-list"></div>
    </section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
